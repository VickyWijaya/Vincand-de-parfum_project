services:
  backend:
    image: node:20-alpine
    container_name: vincand-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-vincand-deu-parfum-secret-key}
      - JWT_EXPIRES_IN=7d
    command: sh -c "npm install --omit=dev && npm start"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: vincand-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped
